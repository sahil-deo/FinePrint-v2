<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse - Legal Contract Analyzer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Synapse</h1>
            <p>Agentic Legal Contract Analysis</p>
        </div>
    </header>
    
    <main>
        <section class="upload-section">
            <h2>Input Agreement</h2>
            
            <div class="input-tabs">
                <button type="button" id="tabUpload" class="tab active">Upload File</button>
                <button type="button" id="tabPaste" class="tab">Paste Text</button>
            </div>

            <form id="uploadForm">
                <div id="uploadView" class="input-view active">
                    <input type="file" id="fileInput" accept=".txt,.md,.pdf,.png,.jpg" required>
                </div>
                
                <div id="pasteView" class="input-view hidden">
                    <textarea id="textInput" placeholder="Paste your contract text here..."></textarea>
                </div>

                <button type="submit">Analyze Contract</button>
            </form>
            
            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Processing via AI Agents...</p>
            </div>
        </section>

        <section id="resultsSection" class="hidden">
            <div id="validationNotes" class="validation-banner"></div>
            <div class="report-header">
                <h2>Contract Analysis Report</h2>
            </div>
            <div id="clausesContainer"></div>
        </section>
    </main>
    
    <script src="/static/app.js"></script>
</body>
</html>
